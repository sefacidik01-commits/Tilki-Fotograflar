name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Projeyi olustur ve derle
        run: |
          set -e
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          cat > package.json <<'EOF'
          {"name":"fotograflar","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^7.0.0","@capacitor/app":"^7.0.0","@capacitor/core":"^7.0.0","@capacitor/filesystem":"^7.0.0"},
           "devDependencies":{"@capacitor/cli":"^7.0.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.fotograflar.app","appName":"Fotoğraflar","webDir":"www","backgroundColor":"#000000"}
          EOF
          npm install
          npx cap add android
          M=android/app/src/main
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application|' $M/AndroidManifest.xml
          cat > $M/java/com/fotograflar/app/MainActivity.java <<'EOF'
          package com.fotograflar.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              String p = Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES : Manifest.permission.READ_EXTERNAL_STORAGE;
              if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this, new String[]{p}, 1);
              }
            }
          }
          EOF
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fotograflar-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
